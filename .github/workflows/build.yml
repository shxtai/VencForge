name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # отдельные шаги: видно, какой таргет падает
      - name: Build (NSIS)
        shell: pwsh
        run: |
          npx electron-builder --win nsis --publish never 2>&1 | Tee-Object -FilePath nsis.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build (Portable)
        shell: pwsh
        run: |
          npx electron-builder --win portable --publish never 2>&1 | Tee-Object -FilePath portable.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Release (attach installers)
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: false

      # упало — сохраняем полный лог в ветку ci-logs (читается обычным git fetch, без API)
      - name: Push logs on failure
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "ci run: ${env:GITHUB_RUN_ID} / ${env:GITHUB_SHA}" | Out-File ci-log.txt -Encoding utf8
          foreach ($f in @('nsis.log', 'portable.log')) {
            if (Test-Path $f) { Get-Content $f | Out-File ci-log.txt -Append -Encoding utf8 }
          }
          New-Item -ItemType Directory -Path logs-repo | Out-Null
          Set-Location logs-repo
          git init -b ci-logs
          git config user.email "ci@vencforge.local"
          git config user.name "vencforge-ci"
          Copy-Item ..\ci-log.txt .
          git add ci-log.txt
          git commit -m "ci log: run ${env:GITHUB_RUN_ID}"
          git push --force "https://x-access-token:${env:GH_TOKEN}@github.com/${env:GITHUB_REPOSITORY}.git" ci-logs
